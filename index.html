<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#253f89"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Julia's English Quest</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#23314c;background:#f2f5fc}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 15px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.65rem;margin:0}h2{margin:0 0 12px}p{line-height:1.5}.muted{color:#64748b}.card{background:white;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 5px 22px #1b34620e}.hero{background:linear-gradient(125deg,#253f89,#6b55be);color:white}.hero .muted{color:#e1e7ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eef2fc;border-radius:13px;text-align:center;padding:13px 4px}.stat strong{display:block;font-size:1.4rem}.stat small{font-size:.73rem}.buttons{display:grid;gap:10px}button,.filelabel{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:#314eae;color:white;text-align:center}button.secondary,.filelabel{background:#e8edfa;color:#29417c}button:disabled{opacity:.5;cursor:default}button.answer{background:#eef2fc;color:#23314c;min-height:56px}button.answer:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #f4ac32}.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input[type=text],select{font:inherit;width:100%;padding:14px;border:2px solid #cdd7eb;border-radius:12px;background:white}label{font-weight:650;display:block;margin:12px 0 6px}.prompt{text-align:center;background:#edf1fa;border-radius:15px;padding:28px 10px;margin:15px 0}.prompt strong{font-size:1.9rem;overflow-wrap:anywhere}.pill{background:#dfe7ff;border-radius:100px;padding:5px 10px;font-size:.82rem;font-weight:700}.bar{height:12px;background:#e1e7f1;border-radius:100px;overflow:hidden}.fill{height:100%;background:#54b99b}.feedback{padding:15px;border-radius:13px;margin:14px 0;background:#e8f8ef}.feedback.bad{background:#fff0e6}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px;f
